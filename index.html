<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Observability POC</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
    #result { margin-top: 20px; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; }
    .success { background: #e6f4ea; border: 1px solid #34a853; }
    .error-400 { background: #fef7e0; border: 1px solid #f9ab00; }
    .error-500 { background: #fce8e6; border: 1px solid #ea4335; }
    label { display: block; margin-top: 20px; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    input[type="number"] { width: 60px; }
  </style>
</head>
<body>
  <h1>Observability POC frontend</h1>
  <p>Sends a test message to Service Bus. The Function App picks it up and calls the Logic App, which returns 200 / 400 / 500 depending on the two rates below. The outcome shows up in the <a href="https://lemon-sand-0cf29101e.5.azurestaticapps.net" target="_blank" rel="noopener">Reliability Console</a> a few minutes later.</p>

  <div>
    <button onclick="callBackend(0, 0)">Call (force success: 200)</button>
    <button onclick="callBackend(100, 0)">Call (force bad payload: 400)</button>
    <button onclick="callBackend(0, 100)">Call (force server error: 500)</button>
  </div>

  <label>
    Custom rates —
    400 rate (%): <input type="number" id="failRateInput" value="10" min="0" max="100">
    500 rate (%): <input type="number" id="failRate500Input" value="5" min="0" max="100">
    <div class="row">
      <button onclick="callCustom()">Call</button>
    </div>
  </label>

  <div id="result">Click a button to send a message...</div>

  <script>
    const FUNCTION_URL = "https://obs-poc-funcapp-axh3hkgsc5e0dyd0.francecentral-01.azurewebsites.net/api/sendmessage";

    async function callBackend(failRate, failRate500) {
      const resultEl = document.getElementById('result');
      resultEl.className = '';
      resultEl.textContent = 'Sending...';
      try {
        const url = `${FUNCTION_URL}?failRate=${encodeURIComponent(failRate)}&failRate500=${encodeURIComponent(failRate500)}`;
        const res = await fetch(url, { method: 'POST' });
        const text = await res.text();

        let data = null;
        try { data = JSON.parse(text); } catch (e) { /* not JSON, show raw text below */ }

        if (res.ok && data && data.sent) {
          resultEl.className = 'success';
          resultEl.textContent =
            `Status: ${res.status}\n` +
            `Message sent to Service Bus\n` +
            `correlationId: ${data.correlationId}\n` +
            `400 rate: ${data.failRate}%   500 rate: ${data.failRate500}%\n` +
            `The outcome appears in the Reliability Console in a few minutes.`;
          return;
        }

        resultEl.className = (res.status >= 400 && res.status < 500) ? 'error-400' : 'error-500';
        resultEl.textContent = `Status: ${res.status}\n` + (data && data.error ? data.error : text);
      } catch (err) {
        resultEl.className = 'error-500';
        resultEl.textContent = 'Request failed: ' + err.message;
      }
    }

    function callCustom() {
      const failRate = document.getElementById('failRateInput').value;
      const failRate500 = document.getElementById('failRate500Input').value;
      callBackend(failRate, failRate500);
    }
  </script>
</body>
</html>
